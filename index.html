<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CULÉ ZONE · Newsletter</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root {
      --azul:#004d98; --grana:#a50044; --oro:#c9a227; --oro-claro:#e8cf7a;
      --noche:#070d1f; --texto:#e6e9f2; --suave:#9aa3b8;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Inter', sans-serif; color:var(--texto);
      min-height:100vh; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      padding:16px; background:var(--noche); position:relative;
    }

    /* Fondo: luces blaugrana que se desplazan lentamente */
    .luz { position:fixed; border-radius:50%; filter:blur(90px); opacity:.55; z-index:0; }
    .luz.a { width:520px; height:520px; background:var(--azul); top:-140px; left:-120px; animation:flotarA 16s ease-in-out infinite alternate; }
    .luz.b { width:480px; height:480px; background:var(--grana); bottom:-160px; right:-120px; animation:flotarB 18s ease-in-out infinite alternate; }
    @keyframes flotarA { to { transform:translate(140px, 90px) scale(1.15); } }
    @keyframes flotarB { to { transform:translate(-120px, -80px) scale(1.1); } }

    /* Franjas verticales finas */
    .franjas {
      position:fixed; inset:0; z-index:0; opacity:.07;
      background:repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 90px);
      animation:deslizar 30s linear infinite;
    }
    @keyframes deslizar { to { background-position:900px 0; } }

    /* Partículas doradas */
    .particula { position:fixed; width:3px; height:3px; border-radius:50%; background:var(--oro-claro); z-index:1; opacity:0; animation:destello linear infinite; }
    @keyframes destello {
      0% { opacity:0; transform:translateY(0); }
      20% { opacity:.9; }
      100% { opacity:0; transform:translateY(-160px); }
    }

    /* Tarjeta */
    .card {
      position:relative; z-index:2;
      width:100%; max-width:460px;
      padding:48px 40px 36px;
      border-radius:22px;
      background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      box-shadow:0 30px 80px rgba(0,0,0,.55);
      text-align:center;
      animation:aparecer 1.1s cubic-bezier(.16,1,.3,1) both;
    }
    .card::before {
      content:""; position:absolute; top:0; left:12%; right:12%; height:2px;
      background:linear-gradient(90deg, transparent, var(--oro), transparent);
      animation:barrido 4s ease-in-out infinite;
    }
    @keyframes barrido { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @keyframes aparecer { from { opacity:0; transform:translateY(40px); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }

    .reveal { opacity:0; animation:subir .9s cubic-bezier(.16,1,.3,1) forwards; }
    .d1 { animation-delay:.25s; } .d2 { animation-delay:.4s; } .d3 { animation-delay:.55s; }
    .d4 { animation-delay:.7s; } .d5 { animation-delay:.85s; }
    @keyframes subir { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

    /* Monograma */
    .monograma {
      width:72px; height:72px; margin:0 auto 22px; position:relative;
      display:flex; align-items:center; justify-content:center;
    }
    .monograma .aro {
      position:absolute; inset:0; border-radius:50%;
      background:conic-gradient(var(--azul), var(--grana), var(--oro), var(--azul));
      animation:rotar 8s linear infinite;
    }
    .monograma .aro::after { content:""; position:absolute; inset:3px; border-radius:50%; background:#0d1530; }
    .monograma span { position:relative; font-family:'Playfair Display', serif; font-size:26px; color:var(--oro-claro); letter-spacing:1px; }
    @keyframes rotar { to { transform:rotate(360deg); } }

    .eyebrow { font-size:11px; letter-spacing:5px; text-transform:uppercase; color:var(--oro); font-weight:500; }
    .logo { font-family:'Playfair Display', serif; font-size:44px; font-weight:700; letter-spacing:2px; margin:8px 0 4px; color:#fff; }
    .divisor { width:48px; height:2px; margin:16px auto 20px; background:linear-gradient(90deg, var(--azul), var(--grana)); border-radius:2px; }
    h1 { font-size:17px; font-weight:500; color:#fff; margin-bottom:10px; }
    p.sub { font-size:14px; font-weight:300; color:var(--suave); line-height:1.7; margin-bottom:28px; }

    form { display:flex; flex-direction:column; gap:12px; }
    .campo { position:relative; }
    input[type=email] {
      width:100%; padding:15px 18px; font-size:15px; font-family:inherit; color:#fff;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.15); border-radius:12px; outline:none;
      transition:border-color .3s, background .3s, box-shadow .3s;
    }
    input::placeholder { color:#7d869c; }
    input[type=email]:focus { border-color:var(--oro); background:rgba(255,255,255,.09); box-shadow:0 0 0 4px rgba(201,162,39,.15); }

    button {
      position:relative; overflow:hidden;
      padding:15px; font-size:14px; font-weight:600; letter-spacing:2px; text-transform:uppercase; font-family:inherit;
      color:#fff; border:none; border-radius:12px; cursor:pointer;
      background:linear-gradient(90deg, var(--azul), var(--grana));
      transition:transform .25s, box-shadow .25s;
    }
    button::after {
      content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
      background:linear-gradient(110deg, transparent, rgba(255,255,255,.35), transparent);
      animation:reflejo 3.5s ease-in-out infinite;
    }
    @keyframes reflejo { 0% { left:-60%; } 60%,100% { left:130%; } }
    button:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(165,0,68,.4); }
    button:active { transform:translateY(0); }
    button:disabled { opacity:.6; cursor:wait; }

    #estado { margin-top:18px; font-size:13px; min-height:20px; letter-spacing:.3px; }
    .ok { color:var(--oro-claro); animation:subir .5s ease; }
    .error { color:#ff8a9e; animation:sacudir .4s ease; }
    @keyframes sacudir { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }

    .pie { margin-top:26px; font-size:11px; color:#6b7389; letter-spacing:.3px; }

    @media (max-width:480px) { .card { padding:40px 24px 30px; } .logo { font-size:36px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; opacity:1 !important; } }
  </style>
</head>
<body>
  <div class="luz a"></div>
  <div class="luz b"></div>
  <div class="franjas"></div>

  <main class="card">
    <div class="monograma reveal d1"><div class="aro"></div><span>CZ</span></div>
    <div class="eyebrow reveal d1">Newsletter blaugrana</div>
    <div class="logo reveal d2">CULÉ ZONE</div>
    <div class="divisor reveal d2"></div>
    <h1 class="reveal d3">Más que un boletín</h1>
    <p class="sub reveal d3">Análisis previo de cada partido, resultados y las noticias más relevantes del Barça, directamente en tu correo.</p>

    <form id="form-suscripcion" class="reveal d4">
      <div class="campo">
        <input type="email" id="email" name="to_email" placeholder="Tu correo electrónico" required>
      </div>
      <button type="submit" id="btn">Suscribirme</button>
    </form>
    <div id="estado"></div>
    <p class="pie reveal d5">Boletín de aficionados, no oficial · Puedes darte de baja cuando quieras</p>
  </main>

  <script>
    const PUBLIC_KEY  = "Jag4dbWrecPbOHQAi";
    const SERVICE_ID  = "service_t0uh4ra";
    const TEMPLATE_ID = "template_m3s0i5a";

    emailjs.init({ publicKey: PUBLIC_KEY });

    // Partículas doradas sutiles
    for (let i = 0; i < 28; i++) {
      const p = document.createElement("div");
      p.className = "particula";
      p.style.left = Math.random() * 100 + "vw";
      p.style.top = (20 + Math.random() * 80) + "vh";
      p.style.animationDuration = (5 + Math.random() * 6) + "s";
      p.style.animationDelay = (-Math.random() * 10) + "s";
      document.body.appendChild(p);
    }

    const form = document.getElementById("form-suscripcion");
    const btn = document.getElementById("btn");
    const estado = document.getElementById("estado");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();

      btn.disabled = true;
      btn.textContent = "Enviando…";
      estado.textContent = "";
      estado.className = "";

      emailjs.send(SERVICE_ID, TEMPLATE_ID, { to_email: email })
        .then(function () {
          estado.textContent = "Suscripción confirmada. Revisa tu bandeja de entrada.";
          estado.className = "ok";
          form.reset();
        })
        .catch(function (err) {
          console.error(err);
          estado.textContent = "No se pudo completar la suscripción. Inténtalo de nuevo.";
          estado.className = "error";
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = "Suscribirme";
        });
    });
  </script>
</body>
</html>
