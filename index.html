<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLASÉ · Suscríbete</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- SDK de EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #3a2a1f 100%);
      padding: 16px;
    }
    .card {
      background: #fffaf5;
      max-width: 440px; width: 100%;
      border-radius: 18px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 36px; letter-spacing: 6px; color: #1a1a1a;
    }
    .logo span { color: #b8864b; }
    .tag { font-size: 12px; letter-spacing: 3px; color: #b8864b; margin: 6px 0 24px; text-transform: uppercase; }
    h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 10px; }
    p.sub { font-size: 14px; color: #6b5e53; line-height: 1.6; margin-bottom: 26px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input[type=email] {
      padding: 14px 16px; font-size: 15px;
      border: 1.5px solid #d9cbbd; border-radius: 10px;
      background: #fff; outline: none; transition: border .2s;
    }
    input[type=email]:focus { border-color: #b8864b; }
    button {
      padding: 14px; font-size: 15px; font-weight: 600;
      background: #1a1a1a; color: #fff;
      border: none; border-radius: 10px; cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #b8864b; }
    button:disabled { opacity: .6; cursor: wait; }
    #estado { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .ok { color: #2e7d32; }
    .error { color: #c62828; }
    small { display: block; margin-top: 22px; font-size: 11px; color: #9a8b7e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GLAS<span>É</span></div>
    <div class="tag">Zapatería</div>
    <h1>Únete a nuestra comunidad</h1>
    <p class="sub">Recibe primero los nuevos lanzamientos, descuentos exclusivos y novedades de temporada.</p>

    <form id="form-suscripcion">
      <input type="email" id="email" name="to_email" placeholder="tucorreo@ejemplo.com" required>
      <button type="submit" id="btn">Suscribirme</button>
    </form>
    <div id="estado"></div>
    <small>Solo te escribiremos con tu permiso. Puedes darte de baja cuando quieras.</small>
  </div>

  <script>
    // ⚠️ Reemplaza estos 3 valores con los de tu cuenta de EmailJS
    const PUBLIC_KEY  = "Jag4dbWrecPbOHQAi";
    const SERVICE_ID  = "service_t0uh4ra";
    const TEMPLATE_ID = "template_m3s0i5a";

    emailjs.init({ publicKey: PUBLIC_KEY });

    const form = document.getElementById("form-suscripcion");
    const btn = document.getElementById("btn");
    const estado = document.getElementById("estado");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();

      btn.disabled = true;
      btn.textContent = "Enviando...";
      estado.textContent = "";
      estado.className = "";

      emailjs.send(SERVICE_ID, TEMPLATE_ID, { to_email: email })
        .then(function () {
          estado.textContent = "¡Listo! Revisa tu bandeja de entrada 📩";
          estado.className = "ok";
          form.reset();
        })
        .catch(function (err) {
          console.error(err);
          estado.textContent = "No se pudo enviar. Intenta de nuevo.";
          estado.className = "error";
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = "Suscribirme";
        });
    });
  </script>
</body>
</html>
